<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <!--
      The desktop app can be served from the `cgpa:` scheme (electron/rendererPath.ts)
      when a file:// read is refused, and CSP's 'self' is documented to match a custom
      scheme only once that scheme is registered as standard. Rather than rely on it,
      every directive below also names `cgpa:`: browsers never see that scheme, so the
      web/PWA policy is unchanged, and a test pins the literal to RENDERER_SCHEME so the
      two cannot drift apart.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' cgpa:; script-src 'self' cgpa:; style-src 'self' cgpa: 'unsafe-inline'; img-src 'self' cgpa: data: blob: https://cgpa-pilot.calcitoninpay.workers.dev; font-src 'self' cgpa: data:; connect-src 'self' cgpa: https://cgpa-pilot.calcitoninpay.workers.dev;"
    />
    <link rel="icon" type="image/png" href="icon-512.png" />
    <!-- Home-screen / Start-menu tile (iOS Safari, Android Chrome "add to home
         screen"). The bundled file is the offline default; src/config/branding.ts
         swaps both of these to the administrator's logo once the published
         configuration is loaded, and the build refreshes the file itself
         (scripts/refresh-brand-icons.mjs) so a fresh install starts correct. -->
    <link rel="apple-touch-icon" sizes="180x180" href="icon-512.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#4f46e5" />
    <meta
      name="description"
      content="CGPA Pilot — offline-first CGPA calculator, target planner and flight-path tool. No account, nothing stored."
    />
    <title>CGPA Pilot — Navigate Your Academic Future</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
