# Cloudflare Pages deployment for the web/PWA version.
# The build emits a fully static site into dist/ — no server runtime.
# Classic Cloudflare Pages Git integration uses the dashboard build settings
# (build command "npm run build:web", output directory "dist"); this file also
# supports CLI deploy via "wrangler pages deploy dist".
name = "cgpa-pilot"
compatibility_date = "2026-08-31"
pages_build_output_dir = "dist"
