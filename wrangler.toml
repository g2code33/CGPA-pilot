# Cloudflare deployment for the web/PWA version.
# The build emits a fully static site into dist/ — no server runtime — so it
# deploys as a static-assets Worker (this `[assets]` config also works with
# `wrangler deploy` on the Cloudflare Workers Builds pipeline).
name = "cgpa-pilot"
compatibility_date = "2026-08-31"

[assets]
directory = "./dist"
